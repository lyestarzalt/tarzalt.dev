# -------------------------------------------------------------------------------------
# Theme Core Configuration
# See: https://fixit.lruihao.cn/theme-documentation-basics/#site-configuration
# -------------------------------------------------------------------------------------

# FixIt 0.2.15 | CHANGED FixIt theme version
version = "0.3.X"
# site description
description = "Personal blog about software engineering, and technology. Sharing insights, projects, and opinions on modern tech."
# site keywords
keywords = ["Lyes Tarzalt", "Software Engineer", "AI", "Voice Agents", "Full Stack", "Technology", "Blog", "Programming"]
# site default theme ["light", "dark", "auto"]
defaultTheme = "auto"
# which hash function used for SRI, when empty, no SRI is used
fingerprint = ""
# date format
dateFormat = "2006-01-02"
# website images for Open Graph and Twitter Cards
images = ["https://media.licdn.com/dms/image/v2/D5603AQFvJzwbuQEq3g/profile-displayphoto-scale_400_400/B56ZjrKQ12IAAg-/0/1756291994832?e=1765411200&v=beta&t=B7v4c18ur6w7JR5B4PrjcrLE8KxpO96LbnyfU0l2Meo"]
# enable PWA
enablePWA = false
# whether to add external Icon for external links automatically
externalIcon = true
# whether to capitalize titles
capitalizeTitles = true
# whether to add site title to the title of every page
withSiteTitle = true
# title delimiter when the site title is be added to the title of every page
titleDelimiter = "-"
# whether to add site subtitle to the title of index page
indexWithSubtitle = false
# whether to show summary in plain text
summaryPlainify = true
# FixIt theme meta tag
disableThemeInject = false

# Author Configuration
[author]
  name = "Lyes Tarzalt"
  email = "lyes.trzlt@gmail.com"
  link = "https://github.com/lyestarzalt"
  avatar = "https://avatars.githubusercontent.com/u/24894134?s=400&u=f2b942884829f239c8283549050b67e04e659232&v=4"

# Git repository information
[gitInfo]
  repo = "https://github.com/lyestarzalt/tarzalt.dev"
  branch = "main"
  dir = "content"
  issueTpl = "title=[BUG]%20{title}&body=|Field|Value|%0A|-|-|%0A|Title|{title}|%0A|URL|{URL}|%0A|Filename|{sourceURL}|"

# App icon config
[app]
  title = "Lyes Tarzalt"
  noFavicon = false
  svgFavicon = "assets/images/favicon.svg"
  iconColor = "#5bbad5"
  tileColor = "#da532c"
  [app.themeColor]
    light = "#f8f8f8"
    dark = "#252627"

# Search config
[search]
  enable = true
  type = "fuse"
  contentLength = 4000
  placeholder = "Search posts..."
  maxResultLength = 10
  snippetLength = 50
  highlightTag = "em"
  absoluteURL = false
  [search.fuse]
    isCaseSensitive = false
    minMatchCharLength = 2
    findAllMatches = false
    location = 0
    threshold = 0.3
    distance = 100
    ignoreLocation = false
    useExtendedSearch = false
    ignoreFieldNorm = false

# Header config
[header]
  desktopMode = "sticky"
  mobileMode = "auto"
  [header.title]
    logo = ""
    name = "Lyes Tarzalt"
    pre = ""
    post = ""
    typeit = false
  [header.subtitle]
    name = "Software Engineer"
    typeit = true

# Breadcrumb config
[breadcrumb]
  enable = true
  sticky = false
  showHome = true
  separator = "/"
  capitalize = true

# Post navigation config
[navigation]
  inSection = true
  reverse = false

# Footer config
[footer]
  enable = true
  copyright = true
  author = true
  since = 2024
  gov = ""
  icp = ""
  license = ''
  [footer.powered]
    enable = false
    hugoLogo = false
    themeLogo = false
  [footer.siteTime]
    enable = false
    animate = true
    icon = "fa-solid fa-heartbeat"
    pre = ""
    value = ""
  [footer.order]
    powered = 0
    copyright = 0
    statistics = 0
    visitor = 0
    beian = 0

# Archives page config
[archives]
  paginate = 20
  dateFormat = "01-02"

# Section page config
[section]
  paginate = 20
  dateFormat = "01-02"
  [section.feed]
    limit = -1
    fullText = false

# Term list page config
[list]
  paginate = 20
  dateFormat = "01-02"
  [list.feed]
    limit = -1
    fullText = false

# Recently updated pages config
[recentlyUpdated]
  archives = true
  section = true
  list = true
  days = 30
  maxCount = 10

# TagCloud config
[tagcloud]
  enable = true
  min = 14
  max = 32
  peakCount = 10
  orderby = "name"

# Home page config
[home]
  [home.profile]
    enable = true
    gravatarEmail = ""
    avatarURL = "https://avatars.githubusercontent.com/u/24894134?s=400&u=1e46b372934da8aa1e45434fb4ec2929b5352142&v=4"
    avatarMenu = ""
    title = "Hi, I'm Lyes 👋"
    subtitle = "Building software. Writing about the messy parts - the architecture, the bugs, and the solutions that actually ship to production."  
    typeit = true
    social = true
  [home.posts]
    enable = true
    paginate = 6

# Social config
[social]
  GitHub = "lyestarzalt"
  Linkedin = "lyes-tarzalt"
  Twitter = ""
  Email = "lyes.trzlt@gmail.com"
  RSS = true

# TypeIt config
[typeit]
  speed = 100
  cursorSpeed = 1000
  cursorChar = "|"
  duration = -1
  loop = false

# Mermaid config
[mermaid]
  themes = ["default", "dark"]

# Admonitions custom config
[admonition]

# Task lists custom config
[taskList]

# Version shortcode config
[repoVersion]
  url = "https://github.com/hugo-fixit/FixIt/releases/tag/v"
  name = "FixIt"

# PanguJS config (for Chinese writing)
[pangu]
  enable = false
  selector = "article"

# Watermark config
[watermark]
  enable = false
  content = ""
  opacity = 0.1
  width = 150
  height = 20
  rowSpacing = 60
  colSpacing = 30
  rotate = 15
  fontSize = 0.85
  fontFamily = "inherit"

# Busuanzi count
[busuanzi]
  enable = false
  source = "https://vercount.one/js"
  siteViews = true
  pageViews = true

# Site verification codes
[verification]
  google = ""
  bing = ""
  yandex = ""
  pinterest = ""
  baidu = ""
  so = ""
  sogou = ""

# Site SEO config
[seo]
  image = "https://avatars.githubusercontent.com/u/24894134?s=400&u=f2b942884829f239c8283549050b67e04e659232&v=4"
  thumbnailUrl = "https://avatars.githubusercontent.com/u/24894134?s=400&u=f2b942884829f239c8283549050b67e04e659232&v=4"

# Analytics config
[analytics]
  enable = true
  [analytics.google]
    id = "G-DSSGSXVXJE"
    anonymizeIP = true
  [analytics.fathom]
    id = ""
    server = ""

# Cookie consent config
[cookieconsent]
  enable = true
  [cookieconsent.content]
    message = ""
    dismiss = ""
    link = ""

# CDN config
[cdn]
  data = ""

# Compatibility config
[compatibility]
  polyfill = false
  objectFit = false

# GitHub corner banner
[githubCorner]
  enable = false
  permalink = "https://github.com/lyestarzalt"
  title = "View source on GitHub"
  position = "right"

# Gravatar config
[gravatar]
  enable = true
  host = "www.gravatar.com"
  style = ""

# Back to top
[backToTop]
  enable = true
  scrollpercent = true

# Reading progress bar
[readingProgress]
  enable = true
  start = "left"
  position = "top"
  reversed = false
  light = ""
  dark = ""
  height = "2px"

# Progress bar during page loading
[pace]
  enable = false
  color = "blue"
  theme = "minimal"

# Global Feed config
[feed]
  limit = 20
  fullText = true
  [feed.follow]
    feedId = ""
    userId = ""

# Custom partials config
[customPartials]
  head = []
  profile = []
  aside = []
  comment = []
  footer = []
  widgets = []
  assets = []
  postFooterBefore = []
  postFooterAfter = []

# Developer options
[dev]
  enable = false
  c4u = false

# Page config
[page]
  authorAvatar = true
  hiddenFromHomePage = false
  hiddenFromSearch = false
  hiddenFromRelated = false
  hiddenFromFeed = false
  twemoji = false
  lightgallery = "force"
  ruby = true
  fraction = true
  fontawesome = true
  license = ''
  linkToMarkdown = false
  linkToSource = true
  linkToEdit = false
  linkToReport = false
  pageStyle = "normal"
  autoBookmark = true
  wordCount = true
  readingTime = true
  endFlag = ""
  instantPage = false
  collectionList = true
  collectionNavigation = true

  [page.repost]
    enable = false
    url = ""
  
  [page.toc]
    enable = true
    keepStatic = false
    auto = true
    position = "right"
    ordered = false
    startLevel = 2
    endLevel = 6
  
  [page.expirationReminder]
    enable = false
    reminder = 90
    warning = 180
    closeComment = false
  
  [page.heading]
    capitalize = false
    [page.heading.number]
      enable = false
      onlyMainSection = true
      [page.heading.number.format]
        h1 = "{title}"
        h2 = "{h2} {title}"
        h3 = "{h2}.{h3} {title}"
        h4 = "{h2}.{h3}.{h4} {title}"
        h5 = "{h2}.{h3}.{h4}.{h5} {title}"
        h6 = "{h2}.{h3}.{h4}.{h5}.{h6} {title}"
  
  [page.math]
    enable = true
    inlineLeftDelimiter = ""
    inlineRightDelimiter = ""
    blockLeftDelimiter = ""
    blockRightDelimiter = ""
    copyTex = true
    mhchem = true
  
  [page.code]
    enable = true
    copy = true
    edit = true
    maxShownLines = 50
  
  [page.mapbox]
    accessToken = ""
    lightStyle = "mapbox://styles/mapbox/light-v11"
    darkStyle = "mapbox://styles/mapbox/dark-v11"
    navigation = true
    geolocate = true
    scale = true
    fullscreen = true
  
  [page.cacheRemoteImages]
    enable = false
    replace = false
  
  [page.related]
    enable = true
    count = 5
  
  [page.reward]
    enable = false
    animation = false
    position = "after"
    mode = "static"
    [page.reward.ways]
  
  [page.share]
    enable = true
    Twitter = true
    Facebook = true
    Linkedin = true
    Whatsapp = false
    Pinterest = false
    Tumblr = false
    HackerNews = true
    Reddit = true
    VK = false
    Buffer = false
    Xing = false
    Line = false
    Instapaper = false
    Pocket = false
    Flipboard = false
    Weibo = false
    Myspace = false
    Blogger = false
    Baidu = false
    Odnoklassniki = false
    Evernote = false
    Skype = false
    Trello = false
    Mix = false
  
  [page.comment]
    enable = false

  [page.library]
    [page.library.css]
    [page.library.js]
  
  [page.seo]
    images = []
    [page.seo.publisher]
      name = "Lyes Tarzalt"
      logoUrl = "https://avatars.githubusercontent.com/u/24894134?s=400&u=f2b942884829f239c8283549050b67e04e659232&v=4"