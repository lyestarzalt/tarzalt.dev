<svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: system-ui, sans-serif; font-size: 11px; }
    .mono { font-family: ui-monospace, monospace; font-size: 10px; }
  </style>

  <!-- X-Plane data example at top -->
  <rect x="20" y="10" width="460" height="35" fill="#1e293b" rx="4"/>
  <text x="30" y="32" fill="#94a3b8" class="mono">112  47.465  -122.311  47.466  -122.310</text>
  <text x="350" y="32" fill="#64748b" class="mono">← node + control</text>

  <!-- Visual diagram below -->

  <!-- Previous node (plain) -->
  <circle cx="80" cy="120" r="8" fill="#64748b"/>
  <text x="80" y="150" text-anchor="middle" fill="#64748b" font-size="10">previous</text>

  <!-- The bezier node -->
  <circle cx="250" cy="120" r="10" fill="#2563eb"/>
  <text x="250" y="165" text-anchor="middle" fill="#2563eb" font-size="10" font-weight="600">47.465, -122.311</text>

  <!-- Stored control point (where X-Plane puts it) -->
  <circle cx="350" cy="80" r="6" fill="#e11d48"/>
  <line x1="250" y1="120" x2="350" y2="80" stroke="#e11d48" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="370" y="75" fill="#e11d48" font-size="10">47.466, -122.310</text>
  <text x="370" y="88" fill="#e11d48" font-size="9">(stored → outgoing)</text>

  <!-- Mirrored control point (what we calculate) -->
  <circle cx="150" cy="160" r="6" fill="#16a34a"/>
  <line x1="250" y1="120" x2="150" y2="160" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="70" y="175" fill="#16a34a" font-size="10">47.464, -122.312</text>
  <text x="70" y="188" fill="#16a34a" font-size="9">(mirrored → incoming)</text>

  <!-- The curve we draw using mirrored control -->
  <path d="M 80 120 Q 150 160 250 120" fill="none" stroke="#2563eb" stroke-width="3"/>

  <!-- Arrow showing curve direction -->
  <text x="140" y="115" fill="#2563eb" font-size="9">curve we draw</text>
</svg>
