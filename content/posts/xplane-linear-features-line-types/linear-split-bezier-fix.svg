<svg viewBox="0 0 500 320" xmlns="http://www.w3.org/2000/svg">
  <style>
    text { font-family: system-ui, sans-serif; }
    .label { font-size: 11px; fill: #666; }
    .title { font-size: 13px; fill: #333; font-weight: 600; }
    .code { font-size: 9px; fill: #333; font-family: monospace; }
    .bad { fill: #ef4444; }
    .good { fill: #10b981; }
  </style>

  <!-- BEFORE section -->
  <text x="125" y="25" text-anchor="middle" class="title bad">BEFORE (Bug)</text>

  <!-- Before diagram -->
  <rect x="20" y="35" width="210" height="130" rx="4" fill="#fef2f2" stroke="#fca5a5"/>

  <!-- Path -->
  <path d="M50,100 Q90,100 110,130" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <line x1="110" y1="130" x2="180" y2="130" stroke="#d1d5db" stroke-width="3" stroke-dasharray="4,2"/>

  <circle cx="50" cy="100" r="8" fill="#f59e0b"/>
  <circle cx="110" cy="130" r="8" fill="#ef4444"/>
  <circle cx="180" cy="130" r="8" fill="#d1d5db"/>

  <text x="50" y="85" text-anchor="middle" class="code">type 53</text>
  <text x="110" y="155" text-anchor="middle" class="code bad">type 0</text>
  <text x="180" y="155" text-anchor="middle" class="code">type 0</text>

  <!-- X mark -->
  <text x="145" y="110" class="label bad" font-weight="bold">missing!</text>

  <!-- Explanation -->
  <text x="125" y="180" text-anchor="middle" class="code">Node C skipped</text>
  <text x="125" y="192" text-anchor="middle" class="code">segment C→D gets type 0</text>
  <text x="125" y="204" text-anchor="middle" class="code bad">Line disappears!</text>

  <!-- Arrow -->
  <path d="M240,100 L260,100 L255,95 M260,100 L255,105" stroke="#666" stroke-width="2" fill="none"/>

  <!-- AFTER section -->
  <text x="375" y="25" text-anchor="middle" class="title good">AFTER (Fixed)</text>

  <!-- After diagram -->
  <rect x="270" y="35" width="210" height="130" rx="4" fill="#f0fdf4" stroke="#86efac"/>

  <!-- Path -->
  <path d="M300,100 Q340,100 360,130" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <line x1="360" y1="130" x2="430" y2="130" stroke="#10b981" stroke-width="3"/>

  <circle cx="300" cy="100" r="8" fill="#f59e0b"/>
  <circle cx="360" cy="130" r="10" fill="#10b981" stroke="#fff" stroke-width="2"/>
  <circle cx="430" cy="130" r="8" fill="#8b5cf6"/>

  <text x="300" y="85" text-anchor="middle" class="code">type 53</text>
  <text x="360" y="155" text-anchor="middle" class="code good">type 53</text>
  <text x="430" y="155" text-anchor="middle" class="code">type 0</text>

  <!-- Check mark -->
  <text x="395" y="110" class="label good" font-weight="bold">added!</text>

  <!-- Explanation -->
  <text x="375" y="180" text-anchor="middle" class="code">Node C coordinate added</text>
  <text x="375" y="192" text-anchor="middle" class="code">even though bezier skipped</text>
  <text x="375" y="204" text-anchor="middle" class="code good">Line renders correctly!</text>

  <!-- Code comparison -->
  <rect x="20" y="220" width="210" height="90" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="30" y="240" class="code">// Old code:</text>
  <text x="30" y="255" class="code">if (samePosition) {</text>
  <text x="30" y="270" class="code bad">  // skip, do nothing</text>
  <text x="30" y="285" class="code">}</text>

  <rect x="270" y="220" width="210" height="90" rx="4" fill="#f9fafb" stroke="#e5e7eb"/>
  <text x="280" y="240" class="code">// Fixed code:</text>
  <text x="280" y="255" class="code">if (samePosition) {</text>
  <text x="280" y="270" class="code good">  addCoord(coord, type);</text>
  <text x="280" y="285" class="code">}</text>
</svg>
