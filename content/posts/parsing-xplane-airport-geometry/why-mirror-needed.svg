<svg viewBox="0 0 500 220" xmlns="http://www.w3.org/2000/svg">
  <style>text { font-family: system-ui, sans-serif; font-size: 10px; }</style>

  <!-- LEFT: Without mirroring (wrong) -->
  <rect x="10" y="10" width="220" height="200" fill="#fef2f2" stroke="#e11d48" rx="6"/>
  <text x="120" y="32" text-anchor="middle" fill="#991b1b" font-weight="600">If we used control directly</text>

  <!-- Wrong curve -->
  <path d="M 50 180 L 50 100 Q 50 50 70 50" fill="none" stroke="#e11d48" stroke-width="3"/>
  <circle cx="50" cy="180" r="5" fill="#e11d48"/>
  <circle cx="50" cy="100" r="6" fill="#e11d48"/>
  <circle cx="110" cy="50" r="8" fill="#e11d48"/>

  <!-- Control used wrongly -->
  <circle cx="50" cy="50" r="5" fill="#e11d48"/>
  <line x1="110" y1="50" x2="50" y2="50" stroke="#e11d48" stroke-width="2" stroke-dasharray="4,3"/>

  <text x="120" y="195" text-anchor="middle" fill="#991b1b" font-size="11">Curve bends the WRONG way!</text>

  <!-- RIGHT: With mirroring (correct) -->
  <rect x="260" y="10" width="220" height="200" fill="#f0fdf4" stroke="#16a34a" rx="6"/>
  <text x="370" y="32" text-anchor="middle" fill="#166534" font-weight="600">With mirroring</text>

  <!-- Correct curve -->
  <path d="M 300 180 L 300 100 Q 300 50 360 50" fill="none" stroke="#16a34a" stroke-width="3"/>
  <circle cx="300" cy="180" r="5" fill="#16a34a"/>
  <circle cx="300" cy="100" r="6" fill="#16a34a"/>
  <circle cx="360" cy="50" r="8" fill="#16a34a"/>

  <!-- Stored control (faded) -->
  <circle cx="300" cy="50" r="4" fill="#94a3b8" opacity="0.5"/>
  <line x1="360" y1="50" x2="300" y2="50" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="290" y="42" fill="#94a3b8" font-size="8">stored</text>

  <!-- Mirrored control (used) -->
  <circle cx="420" cy="50" r="5" fill="#16a34a"/>
  <line x1="360" y1="50" x2="420" y2="50" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="430" y="55" fill="#16a34a" font-size="8">mirrored</text>

  <text x="370" y="195" text-anchor="middle" fill="#166534" font-size="11">Smooth corner!</text>
</svg>
