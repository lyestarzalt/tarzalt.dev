<svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">
  <style>text { font-family: system-ui, sans-serif; font-size: 12px; }</style>

  <!-- Bad example -->
  <rect x="20" y="20" width="210" height="160" fill="#fee2e2" stroke="#e11d48" rx="8"/>
  <text x="125" y="45" text-anchor="middle" fill="#e11d48" font-weight="600" font-size="13">The trap</text>

  <!-- Spike visualization - curve from point to itself creates spike -->
  <path d="M 90 120 Q 160 50 90 120" fill="none" stroke="#e11d48" stroke-width="3"/>
  <circle cx="90" cy="120" r="6" fill="#e11d48"/>
  <circle cx="160" cy="50" r="4" fill="#e11d48" opacity="0.6"/>
  <line x1="90" y1="120" x2="160" y2="50" stroke="#e11d48" stroke-width="1" stroke-dasharray="4,3" opacity="0.5"/>

  <text x="125" y="155" text-anchor="middle" fill="#991b1b" font-size="11">Curve from point to itself</text>
  <text x="125" y="170" text-anchor="middle" fill="#991b1b" font-size="11">= creates spike artifact</text>

  <!-- Good example -->
  <rect x="270" y="20" width="210" height="160" fill="#dcfce7" stroke="#16a34a" rx="8"/>
  <text x="375" y="45" text-anchor="middle" fill="#16a34a" font-weight="600" font-size="13">The fix</text>

  <!-- Two separate curves meeting at a point (split node done right) -->
  <path d="M 300 120 Q 340 70 375 120" fill="none" stroke="#16a34a" stroke-width="3"/>
  <path d="M 375 120 Q 410 170 450 120" fill="none" stroke="#16a34a" stroke-width="3"/>
  <circle cx="375" cy="120" r="6" fill="#16a34a"/>

  <text x="375" y="155" text-anchor="middle" fill="#166534" font-size="11">If start == end position,</text>
  <text x="375" y="170" text-anchor="middle" fill="#166534" font-size="11">skip the degenerate curve</text>
</svg>
