<svg viewBox="0 0 450 180" xmlns="http://www.w3.org/2000/svg">
  <style>text { font-family: system-ui, sans-serif; font-size: 11px; }</style>

  <defs>
    <marker id="arrowBlue" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto">
      <path d="M 0 0 L 6 3 L 0 6 z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="225" y="20" text-anchor="middle" font-weight="600" font-size="13">Split Node: Sharp Corner</text>

  <!-- Incoming curve from left -->
  <path d="M 40 100 Q 120 40 200 100" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="80" y="55" fill="#64748b" font-size="10">incoming curve</text>

  <!-- Outgoing curve to right -->
  <path d="M 200 100 Q 280 160 360 100" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="310" y="145" fill="#64748b" font-size="10">outgoing curve</text>

  <!-- Control point A (for incoming) -->
  <line x1="200" y1="100" x2="120" y2="40" stroke="#16a34a" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="120" cy="40" r="5" fill="#16a34a"/>
  <text x="95" y="30" fill="#16a34a" font-size="10" font-weight="600">ctrl A</text>

  <!-- Control point B (for outgoing) -->
  <line x1="200" y1="100" x2="280" y2="160" stroke="#e11d48" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="280" cy="160" r="5" fill="#e11d48"/>
  <text x="290" y="168" fill="#e11d48" font-size="10" font-weight="600">ctrl B</text>

  <!-- The split node - two nodes stacked to show "two at same position" -->
  <circle cx="200" cy="100" r="10" fill="#2563eb" stroke="white" stroke-width="2"/>
  <circle cx="200" cy="100" r="6" fill="#1d4ed8"/>

  <!-- Annotation box -->
  <rect x="155" y="115" width="90" height="45" fill="#fef3c7" stroke="#f59e0b" rx="4"/>
  <text x="200" y="132" text-anchor="middle" font-size="10" fill="#92400e">Two nodes at</text>
  <text x="200" y="145" text-anchor="middle" font-size="10" fill="#92400e" font-weight="600">same position</text>
  <text x="200" y="156" text-anchor="middle" font-size="9" fill="#92400e">= sharp corner</text>
</svg>
